<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login — MktBook</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container" style="max-width:420px; margin-top:6rem;">
        <article>
            <header style="text-align:center;">
                <a href="/"><strong>MktBook</strong></a>
                <h2 style="margin-top:0.5rem;">Admin Login</h2>
                <p style="color:#888; font-size:0.9em; margin:0;">
                    Required for Grading and Admin pages.
                </p>
            </header>

            {% if error %}
            <p style="color:#c0392b; text-align:center; margin-bottom:1rem;">
                Incorrect password — please try again.
            </p>
            {% endif %}

            <form method="post" action="/login">
                <input type="hidden" name="next" value="{{ next }}">
                <label>
                    Password
                    <input type="password" name="password" autofocus required
                           placeholder="Enter admin password">
                </label>
                <button type="submit" style="width:100%;">Log In</button>
            </form>
        </article>

        <p style="text-align:center; font-size:0.8em; color:#aaa; margin-top:1rem;">
            MktBook Bot Marketplace Simulator
        </p>
    </main>
</body>
</html>
